services:
  - type: web
    name: ibm-tls-contract-analysis
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run contract_analysis_app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

